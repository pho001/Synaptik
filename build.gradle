plugins {
    id 'java'
    id 'application'
}

group = 'computationalgraph'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.ow2.asm:asm:9.6'
    implementation 'org.ow2.asm:asm-commons:9.6'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def runtimeJvmArgs = [
        '--add-modules=jdk.incubator.vector',
        '--enable-native-access=ALL-UNNAMED'
]

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['--add-modules', 'jdk.incubator.vector']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs runtimeJvmArgs
    def configuredTestHeap = System.getProperty('synaptik.testMaxHeap')
    if (configuredTestHeap != null && !configuredTestHeap.isBlank()) {
        maxHeapSize = configuredTestHeap
    } else {
        maxHeapSize = '2g'
    }
}

tasks.withType(JavaExec).configureEach {
    jvmArgs runtimeJvmArgs
}

application {
    mainClass = 'synaptik.app.TuningCli'
    applicationDefaultJvmArgs = runtimeJvmArgs
}

def sourceArtifactRoots = [layout.projectDirectory.dir('src'), layout.projectDirectory.dir('test')]
def sourceArtifactPatterns = ['**/*.class', '**/*.java.txt', '**/*.java.bak', '**/*.java.orig', '**/*.java.tmp', '**/*~', '**/.tmp*', '**/*.tmp*', '**/.DS_Store']

tasks.register('verifySourceTreeClean') {
    group = 'verification'
    description = 'Fails when generated artifacts exist inside src/ or test/.'
    doLast {
        def offenders = sourceArtifactRoots.findAll { it.asFile.exists() }
                .collectMany { root ->
                    fileTree(root) {
                        sourceArtifactPatterns.each { include it }
                    }.files.collect { project.relativePath(it) }
                }
                .sort()
        if (!offenders.isEmpty()) {
            throw new GradleException('Generated artifacts found in source tree: ' + offenders)
        }
    }
}

tasks.register('cleanSourceArtifacts', Delete) {
    group = 'build setup'
    description = 'Deletes generated artifacts accidentally written into src/ or test/.'
    delete sourceArtifactRoots.collectMany { root ->
        fileTree(root) {
            sourceArtifactPatterns.each { include it }
        }.files
    }
}

tasks.named('clean') {
    dependsOn tasks.named('cleanSourceArtifacts')
}

tasks.named('check') {
    dependsOn tasks.named('verifySourceTreeClean')
}

tasks.register('buildMetalMpsShim', Exec) {
    group = 'build setup'
    description = 'Builds the local Metal MPS shim dylib for FFM loading on macOS.'
    onlyIf {
        System.getProperty('os.name', '').toLowerCase().contains('mac')
    }
    commandLine '/bin/zsh', "${project.projectDir}/scripts/build-metal-mps-shim.sh"
    doFirst {
        if (!System.getProperty('os.name', '').toLowerCase().contains('mac')) {
            throw new GradleException('buildMetalMpsShim is supported only on macOS.')
        }
    }
}
