name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  java-tests:
    name: Java tests
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '25'
          cache: gradle

      - name: Compile
        run: ./gradlew classes --no-daemon

      - name: ONNX and source hygiene tests
        run: ./gradlew test --no-daemon --tests 'onnx.*' --tests SourceTreeHygieneTest
