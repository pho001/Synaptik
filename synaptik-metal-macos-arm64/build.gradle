plugins {
    id 'java-library'
    id 'maven-publish'
}

group = rootProject.group
version = rootProject.version

java {
    withSourcesJar()

    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.github.pho001'
            artifactId = 'synaptik-metal-macos-arm64'
            version = project.version

            pom {
                name = 'Synaptik Metal macOS ARM64 native runtime'
                description = 'Prebuilt macOS ARM64 Metal MPS native shim for Synaptik.'
                url = 'https://github.com/pho001/Synaptik'
                scm {
                    url = 'https://github.com/pho001/Synaptik'
                    connection = 'scm:git:https://github.com/pho001/Synaptik.git'
                    developerConnection = 'scm:git:https://github.com/pho001/Synaptik.git'
                }
                developers {
                    developer {
                        id = 'pho001'
                    }
                }
            }
        }
    }
}
